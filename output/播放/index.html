<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成語卡自動播放</title>
<style>
  :root{
    --bg:#FAF6EE; --ink:#2B2B2B; --red:#8C2F26; --gold:#C9A227;
    --gray:#6E6459; --warnbg:#FBEFE4; --warnfg:#B4501F;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{
    font-size: clamp(16px, 2.0vw, 36px);
    background:var(--bg);
  }
  body{
    width:100vw;height:100vh;overflow:hidden;
    background:var(--bg); color:var(--ink);
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
    position:relative;
    cursor:none;
  }
  body::before{
    content:"";position:fixed;inset:1.4vh;
    border:2px solid var(--gold); opacity:.55; pointer-events:none; z-index:5;
  }
  body::after{
    content:"";position:fixed;inset:2.1vh;
    border:1px solid var(--gold); opacity:.35; pointer-events:none; z-index:5;
  }
  .stage{
    position:absolute; inset:0;
    display:flex; flex-direction:column; justify-content:center;
    padding: 5vh 6vw;
    opacity:0; transition:opacity .5s ease;
  }
  .stage.show{ opacity:1; }

  .tag{
    display:inline-block; align-self:flex-start;
    background:var(--red); color:#FBEFE4;
    font-size:1.05rem; letter-spacing:.08em; font-weight:700;
    padding:.5em 1.1em; border-radius:999px;
    margin-bottom:2.2rem;
  }
  .tag-review{ background:var(--gold); color:#3a2e07; }

  .heading{
    font-size:2.4rem; font-weight:700; color:var(--ink);
    margin-bottom:1.6rem;
  }
  .heading-sub{ font-size:1.2rem; color:var(--gray); font-weight:400; margin-left:.6em; }

  /* ---- 標題頁：大成語 + 注音 + 拼音 ---- */
  .title-wrap{ display:flex; flex-direction:column; align-items:center; margin:1vh 0 2vh; }
  .glyphs{ display:flex; gap:2.6rem; }
  .glyph{ display:flex; flex-direction:column; align-items:center; }
  .glyph .zh{ font-size:1.5rem; color:var(--gold); margin-bottom:.5rem; letter-spacing:.05em; }
  .glyph .ch{ font-size:7.4rem; font-weight:700; line-height:1; color:var(--ink); }
  .glyph-fallback{ text-align:center; }
  .glyph-fallback .ch-line{ font-size:6.4rem; font-weight:700; color:var(--ink); }
  .glyph-fallback .zh-line{ font-size:1.6rem; color:var(--gold); margin-top:.8rem; }
  .pinyin{ font-size:1.7rem; color:var(--gold); margin-top:1.6rem; letter-spacing:.06em; }

  /* ---- 字義拆解 ---- */
  .mgrid{ display:flex; flex-wrap:wrap; gap:1.4rem 2.2rem; }
  .mrow{
    display:flex; align-items:baseline; gap:1rem;
    background:#fff; border:1px solid #ECE3D2; border-radius:1rem;
    padding:1rem 1.6rem; flex:1 1 40%;
  }
  .mchar{ font-size:2.3rem; font-weight:700; color:var(--red); }
  .mdesc{ font-size:1.5rem; color:var(--ink); }

  /* ---- 解釋 ---- */
  .block{ margin-bottom:1.8rem; }
  .label{
    font-size:1.15rem; font-weight:700; color:var(--red);
    border-left:.35rem solid var(--red); padding-left:.7rem; margin-bottom:.7rem;
  }
  .text-lg{ font-size:1.75rem; line-height:1.65; }
  .text-md{ font-size:1.4rem; line-height:1.6; color:var(--ink); }
  .muted{ color:var(--gray); }

  /* ---- 例句 ---- */
  .ex-list{ display:flex; flex-direction:column; gap:1.3rem; }
  .ex-row{ display:flex; align-items:flex-start; gap:1.1rem; }
  .ex-num{
    flex:0 0 auto; width:2.1rem; height:2.1rem; border-radius:50%;
    background:var(--red); color:#fff; font-size:1.15rem; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:.15rem;
  }
  .ex-text{ font-size:1.55rem; line-height:1.6; }
  .hl{ color:var(--red); font-weight:700; }

  /* ---- 出處／近反義詞／易錯提醒 ---- */
  .chip-row{ display:flex; gap:2.6rem; margin-bottom:1.6rem; flex-wrap:wrap; }
  .chip-block{ flex:1 1 40%; }
  .chips{ font-size:1.5rem; color:var(--ink); }
  .warn{
    background:var(--warnbg); color:var(--warnfg);
    border-radius:1rem; padding:1.2rem 1.6rem;
    font-size:1.45rem; line-height:1.6;
  }

  /* ---- 複習分隔頁 ---- */
  .divider{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; }
  .divider-label{ font-size:3.4rem; font-weight:700; color:var(--red); }
  .divider-sub{ font-size:1.4rem; color:var(--gray); margin-top:1.2rem; }

  /* ---- 複習卡 ---- */
  .review-wrap{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:2vh; }
  .review-ch{ font-size:5.4rem; font-weight:700; color:var(--ink); }
  .review-zh{ font-size:1.5rem; color:var(--gold); margin-top:1rem; }
  .review-explain{ font-size:1.6rem; color:var(--ink); margin-top:2rem; max-width:80vw; line-height:1.6; }

  /* ---- 待機畫面 ---- */
  .idle{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; }
  .idle-time{ font-size:6rem; font-weight:700; color:var(--gray); letter-spacing:.05em; }
  .idle-msg{ font-size:1.5rem; color:var(--ink); margin-top:1.8rem; }
  .idle-reason{ font-size:1.2rem; color:var(--gray); margin-top:.8rem; }

  /* ---- 底部進度條 ---- */
  .progressbar{
    position:fixed; left:2.1vh; right:2.1vh; bottom:2.1vh;
    height:.5vh; background:#EDE4D2; border-radius:999px; overflow:hidden; z-index:6;
  }
  .progressbar-fill{ height:100%; width:0%; background:var(--gold); }
  .progressbar-fill.run{ transition:width linear; }
</style>
</head>

  <script id="data-idioms" type="application/json">{"系列名稱": "高年級成語", "自動推進": {"起始日": "2026-10-13", "起始序號": 11}, "科目": "國語", "成語": [{"編號": "L01-01", "課次": "第一課", "序號": 1, "成語": "巧奪天工", "注音": "ㄑㄧㄠˇ ㄉㄨㄛˊ ㄊㄧㄢ ㄍㄨㄥ", "拼音": "qiǎo duó tiān gōng", "字義": [{"字": "巧", "義": "精巧、靈巧的技藝"}, {"字": "奪", "義": "勝過、贏過"}, {"字": "天工", "義": "大自然造化的本領"}], "解釋": "人工製作的精巧程度，勝過了大自然的造化。用來形容技藝十分高超巧妙，作品精美得令人讚嘆。", "白話解釋": "人做出來的東西，比老天爺造的還要精緻漂亮。", "出處": "元・趙孟頫〈贈放煙火者〉：「人間巧藝奪天工，煉藥燃燈清晝同。」", "例句": ["故宮的翠玉白菜雕工巧奪天工，連葉尖上的螽斯都栩栩如生。", "這座廟宇的樑柱木雕巧奪天工，每一刀都看得出老師傅的功力。", "姊姊摺的紙鶴巧奪天工，同學都以為是店裡買來的。"], "近義詞": ["鬼斧神工", "匠心獨運", "精雕細琢"], "反義詞": ["粗製濫造", "草草了事"], "易錯提醒": "「巧奪天工」形容的是「人做出來」的作品；如果要形容天然形成的景觀（例如野柳女王頭），一般會用「鬼斧神工」。", "標籤": "高年級成語（一）"}, {"編號": "L01-02", "課次": "第一課", "序號": 2, "成語": "屈指可數", "注音": "ㄑㄩ ㄓˇ ㄎㄜˇ ㄕㄨˇ", "拼音": "qū zhǐ kě shǔ", "字義": [{"字": "屈", "義": "彎曲"}, {"字": "指", "義": "手指頭"}, {"字": "可數", "義": "數得出來"}], "解釋": "彎起手指頭就能數得完。形容數量非常稀少，少到一隻手就數得過來。", "白話解釋": "扳著手指頭就數完了，表示東西或人真的很少。", "出處": "宋・歐陽修〈唐安公美政頌〉：「今文儒之盛，其書屈指可數者，無三四人。」", "例句": ["這種罕見的候鳥全臺灣屈指可數，能親眼看到算是很幸運。", "班上能把整首詩一字不漏背完的同學屈指可數，小美就是其中一個。", "老街上還在用手工做傳統糕餅的店家，如今已經屈指可數了。"], "近義詞": ["寥寥無幾", "鳳毛麟角", "寥若晨星"], "反義詞": ["不計其數", "多如牛毛"], "易錯提醒": "「數」在這裡讀ㄕㄨˇ（計算），不讀ㄕㄨˋ。另外它是形容「數量很少」，不是稱讚人厲害；要說名次在最前面，得用「數一數二」。", "標籤": "高年級成語（二）"}, {"編號": "L01-03", "成語": "拱手讓人", "注音": "ㄍㄨㄥˇ ㄕㄡˇ ㄖㄤˋ ㄖㄣˊ", "拼音": "gǒng shǒu ràng rén", "字義": [{"字": "拱手", "義": "兩手在胸前相合行禮，是恭敬的動作"}, {"字": "讓", "義": "把東西交出去、退讓"}, {"字": "人", "義": "別人"}], "解釋": "平白把原本屬於自己的東西、機會或地位讓給別人。像拱手行禮那樣輕易就交了出去，常帶著「不該就這樣放棄」的惋惜語氣。", "白話解釋": "連爭都沒爭，就把自己的東西雙手送給別人了。", "出處": "《清續文獻通考・卷三八〇・實業考三・農務》：「自然之利，豈容拱手讓人。」", "例句": ["這場比賽我們原本一路領先，最後卻因為鬆懈而把冠軍拱手讓人。", "老師說機會要自己把握，不能因為怕麻煩就拱手讓人。", "那塊空地本來說好給我們班當菜圃，結果沒人去登記，就這樣拱手讓人了。"], "近義詞": ["拱手相讓", "雙手奉送", "不戰而退"], "反義詞": ["當仁不讓", "據理力爭", "寸步不讓"], "易錯提醒": "「拱」不要寫成「供」，拱手是雙手抱拳行禮的動作。另外這句話帶有惋惜、覺得不該放棄的語氣，不是稱讚人謙虛有禮；要誇人懂得禮貌退讓，該用「謙讓」或「禮讓」。", "標籤": "高年級成語（三）"}, {"編號": "L01-04", "成語": "以偏概全", "注音": "ㄧˇ ㄆㄧㄢ ㄍㄞˋ ㄑㄩㄢˊ", "拼音": "yǐ piān gài quán", "字義": [{"字": "以", "義": "用"}, {"字": "偏", "義": "片面、不完整的一部分"}, {"字": "概", "義": "概括、一口氣涵蓋"}, {"字": "全", "義": "全部"}], "解釋": "只拿少數幾個例子或片面的情形，就斷定整體都是這樣。", "白話解釋": "看到一兩個例子，就認定全部都一樣。", "出處": "", "例句": ["班上有兩個同學遲到，就說全班都不守時，這是以偏概全。", "只吃過一次就說這家店難吃，未免太以偏概全了。", "做調查要多問幾個人，才不會以偏概全。"], "近義詞": ["一葉障目", "管中窺豹", "一概而論"], "反義詞": ["面面俱到", "實事求是"], "易錯提醒": "「概」是概括的意思，不要寫成「蓋」。這個詞帶有批評的意味，是指出對方想得不夠周全，不是中性的描述。", "標籤": "高年級成語（四）"}, {"編號": "L01-05", "成語": "瓜熟蒂落", "注音": "ㄍㄨㄚ ㄕㄡˊ ㄉㄧˋ ㄌㄨㄛˋ", "拼音": "guā shóu dì luò", "字義": [{"字": "瓜", "義": "瓜果"}, {"字": "熟", "義": "成熟"}, {"字": "蒂", "義": "瓜果連接莖的那一小截"}, {"字": "落", "義": "脫落"}], "解釋": "瓜成熟了，瓜蒂自然就會脫落。比喻時機一到，事情自然會成功，不必勉強。", "白話解釋": "時候到了，事情自然就成了，不用硬來。", "出處": "南朝梁・張纘〈瓜賦〉（據《藝文類聚・卷八七・菓部下・瓜》引）：「潛湫獨熟，墮莖落蔕。」", "例句": ["練習了一整年，這次比賽拿下冠軍可說是瓜熟蒂落。", "老師說學問要慢慢累積，等到瓜熟蒂落的那天自然就懂了。", "這件事再等一等，時機到了自然瓜熟蒂落，急也沒有用。"], "近義詞": ["水到渠成", "順理成章"], "反義詞": ["揠苗助長", "操之過急"], "易錯提醒": "「蒂」是瓜果連著莖的那一小截，不要寫成「帝」。另外教育部標的讀音是「ㄕㄡˊ」，不是「ㄕㄨˊ」。", "標籤": "高年級成語（五）"}, {"編號": "L01-06", "成語": "潛移默化", "注音": "ㄑㄧㄢˊ ㄧˊ ㄇㄛˋ ㄏㄨㄚˋ", "拼音": "qián yí mò huà", "字義": [{"字": "潛", "義": "暗中、悄悄地"}, {"字": "移", "義": "移動、改變"}, {"字": "默", "義": "不出聲地"}, {"字": "化", "義": "變化"}], "解釋": "人的思想、性格或習慣，在不知不覺之中受到影響而慢慢改變。", "白話解釋": "天天看、天天聽，不知不覺就變得跟他們一樣了。", "出處": "語本北齊・顏之推《顏氏家訓・慕賢》：「潛移暗化，自然似之。」", "例句": ["爸爸每天讀書，弟弟也在潛移默化中養成了閱讀的習慣。", "好的班風會潛移默化，讓每個同學都變得更有禮貌。", "老師的身教往往比說教更能潛移默化。"], "近義詞": ["耳濡目染", "近朱者赤"], "反義詞": ["無動於衷", "我行我素"], "易錯提醒": "是「潛」不是「淺」——潛是暗中悄悄地，跟深淺無關。這個詞多用在好的影響，而且強調「慢慢地、不知不覺」，不能拿來形容突然的改變。", "標籤": "高年級成語（六）"}, {"編號": "L01-07", "成語": "勾心鬥角", "注音": "ㄍㄡ ㄒㄧㄣ ㄉㄡˋ ㄐㄧㄠˇ", "拼音": "gōu xīn dòu jiǎo", "字義": [{"字": "勾", "義": "互相牽引、勾連"}, {"字": "心", "義": "原指宮室的中心"}, {"字": "鬥", "義": "相對、爭鬥"}, {"字": "角", "義": "原指屋角"}], "解釋": "原本形容宮殿建築的結構彼此交錯緊密，後來用來比喻人各自耍心機、互相算計爭鬥。", "白話解釋": "表面上客客氣氣，私底下各自耍心機、互相較勁。", "出處": "語出唐・杜牧〈阿房宮賦〉：「各抱地勢，鉤心鬥角。」", "例句": ["同學之間應該互相幫忙，不要為了名次勾心鬥角。", "那部戲演的是幾個大家族勾心鬥角的故事。", "合作最怕的就是大家各懷鬼胎、勾心鬥角。"], "近義詞": ["明爭暗鬥", "爾虞我詐", "各懷鬼胎"], "反義詞": ["同心協力", "肝膽相照", "開誠布公"], "易錯提醒": "教育部《成語典》的正文寫作「鉤心鬥角」，「勾心鬥角」是又作，兩種都通。「角」在這裡唸ㄐㄧㄠˇ，指屋角，不唸ㄐㄩㄝˊ。", "標籤": "高年級成語（七）"}, {"編號": "L01-08", "成語": "腰纏萬貫", "注音": "ㄧㄠ ㄔㄢˊ ㄨㄢˋ ㄍㄨㄢˋ", "拼音": "yāo chán wàn guàn", "字義": [{"字": "腰纏", "義": "纏在腰上，古人把錢串起來繫在腰間"}, {"字": "萬貫", "義": "一萬串錢。貫是古代錢幣單位，一千錢為一貫"}], "解釋": "腰上纏著上萬串錢，形容一個人非常有錢、財富極多。", "白話解釋": "身上帶著花不完的錢，就是很有錢的意思。", "出處": "典出南朝梁・殷芸《小說・卷六・吳蜀人》：「腰纏十萬貫，騎鶴上揚州。」", "例句": ["故事裡那個腰纏萬貫的富翁，最後才明白錢買不到快樂。", "他雖然腰纏萬貫，生活卻十分簡樸。", "與其羨慕別人腰纏萬貫，不如踏實地做好自己的事。"], "近義詞": ["富可敵國", "家財萬貫"], "反義詞": ["一貧如洗", "家徒四壁", "身無分文"], "易錯提醒": "「貫」是古代把錢串起來的單位，一千錢為一貫，所以「萬貫」是非常大的一筆錢。這個詞單純形容有錢，本身沒有褒貶。", "標籤": "高年級成語（八）"}, {"編號": "L01-09", "成語": "作繭自縛", "注音": "ㄗㄨㄛˋ ㄐㄧㄢˇ ㄗˋ ㄈㄨˊ", "拼音": "zuò jiǎn zì fú", "字義": [{"字": "作繭", "義": "蠶吐絲結成繭"}, {"字": "自縛", "義": "把自己綁住"}], "解釋": "蠶吐絲結繭，反而把自己包在裡面出不來。比喻做了某件事，結果反而讓自己陷入困境。", "白話解釋": "自己做的事，最後困住的卻是自己。", "出處": "語本《景德傳燈錄・卷二九・誌公和尚・十四科頌・善惡不二》：「聲聞執法坐禪，如蠶吐絲自縛。」", "例句": ["他為了圓一個謊，只好再說更多謊，簡直是作繭自縛。", "規定訂得太死，最後反而作繭自縛，自己也不好做事。", "你把話說得那麼滿，現在做不到，不就作繭自縛了嗎？"], "近義詞": ["自食其果", "自作自受", "玩火自焚"], "反義詞": ["未雨綢繆", "明哲保身"], "易錯提醒": "「縛」教育部標的讀音是ㄈㄨˊ，不是ㄈㄨˋ。這個詞是說「自己害到自己」，帶有責備或惋惜的意思，不能用來形容單純的辛苦忙碌。", "標籤": "高年級成語（九）"}, {"編號": "L01-10", "成語": "冰消瓦解", "注音": "ㄅㄧㄥ ㄒㄧㄠ ㄨㄚˇ ㄐㄧㄝˇ", "拼音": "bīng xiāo wǎ jiě", "字義": [{"字": "冰", "義": "冰塊"}, {"字": "消", "義": "融化、消失"}, {"字": "瓦", "義": "屋瓦"}, {"字": "解", "義": "碎裂散開"}], "解釋": "像冰融化、像屋瓦碎裂一樣。比喻事物徹底崩潰瓦解，也用來比喻問題完全解除。", "白話解釋": "像冰化掉、瓦片散掉一樣，整個垮了、散了。", "出處": "語本三國魏・陳琳〈檄吳將校部曲文〉（據《文選・卷四四・檄》引），原作「瓦解冰泮」。", "例句": ["聽完老師的說明，大家心中的疑慮就冰消瓦解了。", "對方一棒逆轉，我們原本的領先優勢瞬間冰消瓦解。", "誤會說開以後，兩人多年的心結終於冰消瓦解。"], "近義詞": ["分崩離析", "煙消雲散", "土崩瓦解"], "反義詞": ["堅如磐石", "固若金湯"], "易錯提醒": "「瓦」在這裡指屋瓦，唸ㄨㄚˇ不是ㄨㄚˋ。這個詞原本形容整個垮掉（偏負面），後來也能用在「疑慮、心結消失」這類正面情況，要看前後文判斷。", "標籤": "高年級成語（十）"}, {"編號": "L01-11", "成語": "口蜜腹劍", "注音": "ㄎㄡˇ ㄇㄧˋ ㄈㄨˋ ㄐㄧㄢˋ", "拼音": "kǒu mì fù jiàn", "字義": [{"字": "口", "義": "嘴巴，指說出來的話"}, {"字": "蜜", "義": "甜得像蜜"}, {"字": "腹", "義": "肚子，指內心"}, {"字": "劍", "義": "害人的刀劍"}], "解釋": "嘴裡說著甜言蜜語，肚子裡卻藏著刀劍。比喻一個人表面友善，內心卻陰險，暗中想害人。", "白話解釋": "嘴巴講得很甜，心裡卻在想怎麼害你。", "出處": "語本五代周・王仁裕《開元天寶遺事・肉腰刀》：「李公雖面有笑容而肚中鑄劍也。」", "例句": ["他表面上對誰都客客氣氣，其實口蜜腹劍，背後常說人壞話。", "故事裡那個大臣口蜜腹劍，害了不少忠良。", "交朋友要看久一點，才分得出是真心還是口蜜腹劍。"], "近義詞": ["佛口蛇心", "笑裡藏刀", "兩面三刀"], "反義詞": ["表裡如一", "心口如一", "光明磊落"], "易錯提醒": "「腹」是肚子（指內心），不要寫成「覆」。跟「笑裡藏刀」很像，差別在於「口蜜腹劍」強調說的「話」很甜，「笑裡藏刀」強調「表情」很和善。", "標籤": "高年級成語（十一）"}, {"編號": "L01-12", "成語": "因材施教", "注音": "ㄧㄣ ㄘㄞˊ ㄕ ㄐㄧㄠˋ", "拼音": "yīn cái shī jiào", "字義": [{"字": "因", "義": "依照、根據"}, {"字": "材", "義": "資質、才能"}, {"字": "施", "義": "施行、給予"}, {"字": "教", "義": "教導"}], "解釋": "依照每個人資質與能力的不同，給予適合他的教導方式。", "白話解釋": "每個人的條件不一樣，就用最適合他的方法來教。", "出處": "語本《二程集・河南程氏遺書・卷一九》：「孔子教人，各因其材。」", "例句": ["老師因材施教，對不同程度的同學出不同的練習題。", "每個孩子的長處都不一樣，教育本來就該因材施教。", "他很懂得因材施教，連最不愛讀書的學生都被他帶起來了。"], "近義詞": ["對症下藥", "量體裁衣"], "反義詞": ["一概而論", "削足適履"], "易錯提醒": "「材」指資質、才能，不要寫成「才」或「財」。另外這句話的出處常被誤寫成《論語》，教育部標的其實是程頤《二程集》：「孔子教人，各因其材。」", "標籤": "高年級成語（十二）"}, {"編號": "L01-13", "成語": "悲天憫人", "注音": "ㄅㄟ ㄊㄧㄢ ㄇㄧㄣˇ ㄖㄣˊ", "拼音": "bēi tiān mǐn rén", "字義": [{"字": "悲", "義": "哀傷"}, {"字": "天", "義": "天命、時局"}, {"字": "憫", "義": "憐惜、同情"}, {"字": "人", "義": "百姓"}], "解釋": "哀嘆時局多變，同情百姓的苦難。形容人心胸寬厚，對世間的苦難懷著深深的不忍。", "白話解釋": "看到世上的苦難會難過，真心疼惜受苦的人。", "出處": "語本唐・韓愈〈爭臣論〉：「誠畏天命而悲人窮也。」", "例句": ["這位醫生行醫一輩子，是個悲天憫人的長者。", "讀了那篇報導，我才體會到作者悲天憫人的心情。", "他自己並不富裕，卻總是悲天憫人，看到需要幫助的人就伸出援手。"], "近義詞": ["民胞物與", "己飢己溺", "惻隱之心"], "反義詞": ["幸災樂禍", "漠然置之"], "易錯提醒": "「憫」唸ㄇㄧㄣˇ，是憐惜的意思，不要寫成「閔」。這個詞形容的是對「眾人、世間苦難」的同情，不是單純為某一個人難過。", "標籤": "高年級成語（十三）"}, {"編號": "L01-14", "成語": "一言九鼎", "注音": "ㄧ ㄧㄢˊ ㄐㄧㄡˇ ㄉㄧㄥˇ", "拼音": "yī yán jiǔ dǐng", "字義": [{"字": "一", "義": "一句"}, {"字": "言", "義": "話"}, {"字": "九鼎", "義": "夏商周相傳的九座大鼎，是國家重器，極為貴重"}], "解釋": "一句話的分量就像九鼎那麼重。形容說出來的話很有分量、很有信用。", "白話解釋": "說一句話就很有份量，大家都信得過。", "出處": "典出《史記・卷七六・平原君虞卿列傳》：「毛先生一至楚，而使趙重於九鼎大呂。」", "例句": ["校長在全校面前承諾的事一言九鼎，從來沒有跳票過。", "他平常話不多，但說出口就一言九鼎。", "答應別人的事要做到，自己的話才會一言九鼎。"], "近義詞": ["一諾千金", "言出必行", "說一不二"], "反義詞": ["空口說白話", "食言而肥", "人微言輕"], "易錯提醒": "「鼎」是古代的大鍋，不要寫成「頂」。這個詞形容話有「分量」，不是形容話說得多。", "標籤": "高年級成語（十四）"}, {"編號": "L01-15", "成語": "淋漓盡致", "注音": "ㄌㄧㄣˊ ㄌㄧˊ ㄐㄧㄣˋ ㄓˋ", "拼音": "lín lí jìn zhì", "字義": [{"字": "淋漓", "義": "溼透、暢快的樣子"}, {"字": "盡致", "義": "到了極點、毫無保留"}], "解釋": "形容文章或言語表達得非常透徹，也用來形容表現得生動逼真、毫無保留。", "白話解釋": "講得、寫得、演得非常徹底，該表現的全都表現出來了。", "出處": "語本明・李清《三垣筆記・卷上・崇禎補遺》。", "例句": ["這篇作文把思念阿嬤的心情寫得淋漓盡致。", "他把劇中那個角色演得淋漓盡致，台下都看入迷了。", "這場比賽他發揮得淋漓盡致，實力完全展現出來。"], "近義詞": ["刻畫入微", "入木三分"], "反義詞": ["輕描淡寫", "不著邊際"], "易錯提醒": "「漓」是三點水旁，不要寫成「離」。這個詞是稱讚表達得很徹底，用在文章、表演、發揮上，不能拿來形容「做事做得很累」。", "標籤": "高年級成語（十五）"}, {"編號": "L01-16", "成語": "雨後春筍", "注音": "ㄩˇ ㄏㄡˋ ㄔㄨㄣ ㄙㄨㄣˇ", "拼音": "yǔ hòu chūn sǔn", "字義": [{"字": "雨後", "義": "下過雨之後"}, {"字": "春筍", "義": "春天的竹筍"}], "解釋": "春雨過後竹筍長得又快又多。比喻某一類事物在短時間內大量出現、迅速發展。", "白話解釋": "像下過雨的竹筍一樣，一下子冒出來一大堆。", "出處": "語本宋・趙蕃〈過易簡彥從〉詩（據《章泉稿》引）：「雨後筍怒長，春雨陰暗成。」", "例句": ["這幾年手搖飲料店如雨後春筍般開了起來。", "比賽消息一公布，報名的隊伍就像雨後春筍一樣冒出來。", "社團博覽會之後，校園裡的新社團如雨後春筍般成立。"], "近義詞": ["層出不窮", "比比皆是"], "反義詞": ["寥寥無幾", "鳳毛麟角"], "易錯提醒": "「筍」是竹字頭，不要寫成「荀」。這個詞強調「數量多、速度快」，好事壞事都能用，本身沒有褒貶。", "標籤": "高年級成語（十六）"}, {"編號": "L01-17", "成語": "目不識丁", "注音": "ㄇㄨˋ ㄅㄨˋ ㄕˋ ㄉㄧㄥ", "拼音": "mù bù shì dīng", "字義": [{"字": "目", "義": "眼睛"}, {"字": "不識", "義": "不認得"}, {"字": "丁", "義": "筆畫最少、最簡單的字之一"}], "解釋": "連「丁」這麼簡單的字都不認得。形容人完全不識字、沒有讀過書。", "白話解釋": "一個字也不認得。", "出處": "語本《舊唐書・卷一二九・張延賞傳》：「今天下無事，汝輩挽得兩石力弓，不如識一丁字。」", "例句": ["阿祖那一輩很多人目不識丁，卻把孩子都栽培成大學生。", "故事主角原本目不識丁，上了夜校才學會寫自己的名字。", "他雖然目不識丁，做人處事的道理卻比誰都懂。"], "近義詞": ["不識之無", "胸無點墨"], "反義詞": ["學富五車", "滿腹經綸", "博學多聞"], "易錯提醒": "「丁」不要寫成「釘」。這個詞帶有貶義，是說人完全不識字，用來形容別人時要小心，不要拿來開玩笑。", "標籤": "高年級成語（十七）"}, {"編號": "L01-18", "成語": "相得益彰", "注音": "ㄒㄧㄤ ㄉㄜˊ ㄧˋ ㄓㄤ", "拼音": "xiāng dé yì zhāng", "字義": [{"字": "相得", "義": "互相配合得很好"}, {"字": "益", "義": "更加"}, {"字": "彰", "義": "明顯、突出"}], "解釋": "互相搭配、彼此襯托，使雙方的優點都更加突顯出來。", "白話解釋": "兩個湊在一起，彼此都變得更出色。", "出處": "語本漢・王褒〈聖主得賢臣頌〉（據《漢書・卷六四下》引）：「聚精會神，相得益章。」", "例句": ["這篇文章配上他的插畫，兩者相得益彰。", "他擅長進攻、你擅長防守，合作起來相得益彰。", "古蹟保存和觀光發展如果規劃得好，可以相得益彰。"], "近義詞": ["相輔相成", "相映成趣"], "反義詞": ["相形見絀", "兩敗俱傷"], "易錯提醒": "典源原本寫作「相得益章」，「章」和「彰」在這裡同義，現在通用「彰」。注意它是說「雙方都變更好」，不是單方面受益。", "標籤": "高年級成語（十八）"}, {"編號": "L01-19", "成語": "欲蓋彌彰", "注音": "ㄩˋ ㄍㄞˋ ㄇㄧˊ ㄓㄤ", "拼音": "yù gài mí zhāng", "字義": [{"字": "欲", "義": "想要"}, {"字": "蓋", "義": "遮蓋、掩飾"}, {"字": "彌", "義": "更加"}, {"字": "彰", "義": "明顯"}], "解釋": "想要掩蓋事實，結果反而讓事情更加明顯。", "白話解釋": "越想遮掩，反而越讓人看得一清二楚。", "出處": "語本《左傳・昭公三十一年》：「或欲蓋而名章，懲不義也。」", "例句": ["他把考卷藏起來不給爸媽看，反而欲蓋彌彰。", "說謊之後又急著解釋，往往欲蓋彌彰。", "刻意迴避這個問題，欲蓋彌彰，大家反而更好奇。"], "近義詞": ["此地無銀三百兩", "弄巧成拙"], "反義詞": ["坦承不諱", "光明磊落"], "易錯提醒": "「彌」是更加的意思，不要寫成「迷」。它跟「相得益彰」的「彰」是同一個字（明顯），但意思完全相反——一個是越搭越好，一個是越掩越糟。", "標籤": "高年級成語（十九）"}]}</script>

    const stage  = document.getElementById("stage");
    const pbfill = document.getElementById("pbfill");
    const params = new URLSearchParams(location.search);
    const DEMO   = params.has("demo");

    // 離線快取：只有從網站開啟時才註冊（file:// 開啟時略過）。
    // 成功載入過一次之後，就算學校早上網路不通也能照常播放。
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      navigator.serviceWorker.register("sw.js").catch(function(){ /* 註冊失敗不影響播放 */ });
    }

    // 播放期間不讓螢幕休眠（大螢幕/投影機用途）；不支援或被拒絕就靜默略過，不影響輪播本身。
    let wakeLock = null;
    function ensureWakeLock(){
      if (!("wakeLock" in navigator) || wakeLock) return;
      navigator.wakeLock.request("screen").then(function(lock){
        wakeLock = lock;
        wakeLock.addEventListener("release", function(){ wakeLock = null; });
      }).catch(function(){ /* 忽略：例如非安全環境或裝置不支援 */ });
    }
    document.addEventListener("visibilitychange", function(){
      if (document.visibilityState === "visible" && mode === "deck") ensureWakeLock();
    });

    function pad(n){ return String(n).padStart(2,"0"); }
    function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
    function hm(d){ return pad(d.getHours())+":"+pad(d.getMinutes()); }
    function parseHM(s){ const p=(s||"").split(":").map(Number); return (p[0]||0)*60+(p[1]||0); }

    function isSchoolDay(d){
      const day = d.getDay();
      if (day===0 || day===6) return {ok:false, reason:"週末"};
      const ds = dateStr(d);
      const range = SCHEDULE.學期起訖;
      if (range && range.開始 && range.結束 && (ds < range.開始 || ds > range.結束)) {
        return {ok:false, reason:"不在學期範圍內"};
      }
      const off = (SCHEDULE.停課日||[]).find(function(x){ return x.日期===ds; });
      if (off) return {ok:false, reason: off.說明 || "停課日"};
      return {ok:true, reason:null};
    }

    function inPlayWindow(d){
      const nowM = d.getHours()*60 + d.getMinutes();
      const startM = parseHM(SCHEDULE.播放時段 && SCHEDULE.播放時段.開始 || "07:30");
      const endM   = parseHM(SCHEDULE.播放時段 && SCHEDULE.播放時段.結束 || "08:30");
      return nowM >= startM && nowM < endM;
    }

    function shuffle(arr){
      for (let i=arr.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        const t = arr[i]; arr[i]=arr[j]; arr[j]=t;
      }
      return arr;
    }

    function escapeHtml(s){
      return String(s==null?"":s)
        .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function highlight(sentence, idiom){
      const safeIdiom = escapeHtml(idiom);
      return escapeHtml(sentence).split(safeIdiom).join('<span class="hl">'+safeIdiom+'</span>');
    }

    function renderTitle(idiom, tag){
      const chars = Array.from(idiom.成語||"");
      const zh = (idiom.注音||"").split(/\s+/).filter(Boolean);
      let glyphs;
      if (chars.length && chars.length===zh.length){
        glyphs = chars.map(function(c,i){
          return '<div class="glyph"><div class="zh">'+escapeHtml(zh[i])+'</div><div class="ch">'+escapeHtml(c)+'</div></div>';
        }).join("");
        glyphs = '<div class="glyphs">'+glyphs+'</div>';
      } else {
        glyphs = '<div class="glyph-fallback"><div class="ch-line">'+escapeHtml(idiom.成語)+'</div>'
               + '<div class="zh-line">'+escapeHtml(idiom.注音||"")+'</div></div>';
      }
      return '<div class="tag">'+escapeHtml(tag)+'</div>'
           + '<div class="title-wrap">'+glyphs
           + '<div class="pinyin">'+escapeHtml(idiom.拼音||"")+'</div></div>';
    }

    function renderMeaning(idiom, tag){
      const rows = (idiom.字義||[]).map(function(m){
        return '<div class="mrow"><div class="mchar">'+escapeHtml(m.字)+'</div><div class="mdesc">'+escapeHtml(m.義)+'</div></div>';
      }).join("");
      return '<div class="tag">'+escapeHtml(tag)+'</div>'
           + '<div class="heading">'+escapeHtml(idiom.成語)+'<span class="heading-sub">・字義拆解</span></div>'
           + '<div class="mgrid">'+rows+'</div>';
    }

    function renderExplain(idiom, tag){
      return '<div class="tag">'+escapeHtml(tag)+'</div>'
           + '<div class="heading">'+escapeHtml(idiom.成語)+'<span class="heading-sub">・解釋</span></div>'
           + '<div class="block"><div class="label">解釋</div><div class="text-lg">'+escapeHtml(idiom.解釋||"")+'</div></div>'
           + '<div class="block"><div class="label">白話一點說</div><div class="text-lg muted">'+escapeHtml(idiom.白話解釋||"")+'</div></div>';
    }

    function renderExamples(idiom, tag){
      const items = (idiom.例句||[]).map(function(s,i){
        return '<div class="ex-row"><div class="ex-num">'+(i+1)+'</div><div class="ex-text">'+highlight(s, idiom.成語)+'</div></div>';
      }).join("");
      return '<div class="tag">'+escapeHtml(tag)+'</div>'
           + '<div class="heading">'+escapeHtml(idiom.成語)+'<span class="heading-sub">・例句</span></div>'
           + '<div class="ex-list">'+items+'</div>';
    }

    function renderExtra(idiom, tag){
      const near = (idiom.近義詞||[]).join("、");
      const anti = (idiom.反義詞||[]).join("、");
      let chips = "";
      if (near || anti){
        chips = '<div class="chip-row">'
          + (near ? '<div class="chip-block"><div class="label">近義詞</div><div class="chips">'+escapeHtml(near)+'</div></div>' : "")
          + (anti ? '<div class="chip-block"><div class="label">反義詞</div><div class="chips">'+escapeHtml(anti)+'</div></div>' : "")
          + '</div>';
      }
      return '<div class="tag">'+escapeHtml(tag)+'</div>'
           + '<div class="heading">'+escapeHtml(idiom.成語)+'<span class="heading-sub">・補充</span></div>'
           + (idiom.出處 ? '<div class="block"><div class="label">出處</div><div class="text-md">'+escapeHtml(idiom.出處)+'</div></div>' : "")
           + chips
           + (idiom.易錯提醒 ? '<div class="warn">⚠️ '+escapeHtml(idiom.易錯提醒)+'</div>' : "");
    }

    function renderDivider(){
      return '<div class="divider"><div class="divider-label">複習時間</div>'
           + '<div class="divider-sub">一起再唸一次前面學過的成語</div></div>';
    }

    function renderReview(idiom){
      return '<div class="tag tag-review">複習・'+escapeHtml(idiom.標籤||"")+'</div>'
           + '<div class="review-wrap">'
           + '<div class="review-ch">'+escapeHtml(idiom.成語)+'</div>'
           + '<div class="review-zh">'+escapeHtml(idiom.注音||"")+'</div>'
           + '<div class="review-explain">'+escapeHtml(idiom.解釋||"")+'</div>'
           + '</div>';
    }

    // 從「自動推進.起始日」起算，每經過一個上課日就往後推一則。
    // 用的是跟播放判斷同一份停課日清單，所以週末、國定假日、臨時停課
    // 都不會消耗進度。
    function 自動推進序號(now){
      const cfg = IDIOMS.自動推進;
      const start = new Date(cfg.起始日 + "T00:00:00");
      if (isNaN(start.getTime())) return -1;

      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let n = 0, guard = 0;
      const d = new Date(start.getTime());
      while (d <= today && guard < 3000) {
        if (isSchoolDay(d).ok) n++;
        d.setDate(d.getDate() + 1);
        guard++;
      }
      const base = (cfg.起始序號 || 1) - 1;
      return base + Math.max(0, n - 1);
    }

    function buildDeck(){
      const list = IDIOMS.成語 || [];
      if (!list.length) return [];
      // 今日成語的決定方式，依序：
      //   1. 頂層「今日序號」（1 起算）——手動釘住某一則，優先權最高
      //   2. 頂層「今日編號」（例如 "L01-02"）
      //   3. 頂層「自動推進」——從起始日算起，每過一個上課日往後推一則
      //   4. 都沒設就用陣列最後一筆
      let todayIdx = -1;
      if (IDIOMS.今日序號) {
        todayIdx = IDIOMS.今日序號 - 1;
      } else if (IDIOMS.今日編號) {
        todayIdx = list.findIndex(function(x){ return x.編號===IDIOMS.今日編號; });
      } else if (IDIOMS.自動推進 && IDIOMS.自動推進.起始日) {
        todayIdx = 自動推進序號(new Date());
      }
      if (todayIdx < 0) todayIdx = list.length - 1;
      // 成語用完了就停在最後一則，等老師補新的，不要繞回頭重來
      if (todayIdx >= list.length) todayIdx = list.length - 1;

      const today = list[todayIdx];
      const tag = today.標籤 || "";
      // 複習只播「已經教過的」，也就是排在今日成語前面的那幾則；
      // 後面還沒教到的不會出現，才不會提前曝光。
      const others = list.slice(0, todayIdx);
      shuffle(others);

      const deck = [
        { render:function(){ return renderTitle(today, tag); },   dur:8000  },
        { render:function(){ return renderMeaning(today, tag); }, dur:10000 },
        { render:function(){ return renderExplain(today, tag); }, dur:10000 },
        { render:function(){ return renderExamples(today, tag); }, dur:13000 },
        { render:function(){ return renderExtra(today, tag); },   dur:12000 }
      ];
      if (others.length){
        deck.push({ render:renderDivider, dur:3500 });
        others.forEach(function(o){
          deck.push({ render:function(){ return renderReview(o); }, dur:7000 });
        });
      }
      return deck;
    }

    let deck = [], idx = 0, timer = null, pbTimer = null, mode = null;

    function runProgressBar(duration){
      pbfill.classList.remove("run");
      pbfill.style.transition = "none";
      pbfill.style.width = "0%";
      // 強制 reflow 讓下一次的 transition 生效
      void pbfill.offsetWidth;
      clearTimeout(pbTimer);
      pbTimer = setTimeout(function(){
        pbfill.style.transition = "width "+duration+"ms linear";
        pbfill.classList.add("run");
        pbfill.style.width = "100%";
      }, 30);
    }

    function showSlide(){
      if (!deck.length){
        fadeIn('<div class="idle"><div class="idle-msg">尚未建立任何成語資料，請先更新 data/成語資料.json</div></div>');
        pbfill.style.width = "0%";
        return;
      }
      const slide = deck[idx];
      fadeIn(slide.render());
      runProgressBar(slide.dur);
      clearTimeout(timer);
      timer = setTimeout(advance, slide.dur);
    }

    function advance(){
      idx++;
      if (idx >= deck.length){ idx = 0; deck = buildDeck(); }
      showSlide();
    }

    // 字數多的成語（例如「醉翁之意不在酒」）或比較窄的螢幕，大字可能會超出畫面寬度。
    // 這裡量完真實寬度後按比例縮小，確保任何字數、任何解析度都不會被切到。
    // 版面自動適配。兩件事：
    //   1. 高度放不下 → 直接調小根字級（所有尺寸都是 rem，等於整頁等比縮小）
    //   2. 大字列太寬 → 單獨把那一列 scale 縮小
    // 先做高度再做寬度，順序不能反，因為縮字級會改變寬度。
    //
    // 注意：剛換頁的那一個 frame 有時還沒完成版面配置，量到的高度會是 0，
    // 這時不能判定「放得下」，必須等下一輪重量，否則會漏縮。
    function fitSlide(attempt){
      attempt = attempt || 0;

      // 先還原成基準字級再量，否則會沿用上一頁縮小後的結果、愈縮愈小
      document.documentElement.style.fontSize = "";

      const cs = getComputedStyle(stage);
      const availH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const kids = stage.children;
      if (!kids.length || !(availH > 0) || !(availW > 0)) return;

      function contentHeight(){
        const first = kids[0].getBoundingClientRect();
        const last  = kids[kids.length - 1].getBoundingClientRect();
        return last.bottom - first.top;
      }

      let h = contentHeight();
      if (h === 0) {
        if (attempt < 10) setTimeout(function(){ fitSlide(attempt + 1); }, 50);
        return;
      }

      let size = parseFloat(getComputedStyle(document.documentElement).fontSize);
      let guard = 0;
      while (h > availH && guard < 30 && size > 12) {
        size = size * 0.96;
        document.documentElement.style.fontSize = size + "px";
        h = contentHeight();
        guard++;
      }

      const wide = stage.querySelectorAll(".glyphs, .glyph-fallback .ch-line, .review-ch");
      wide.forEach(function(el){
        el.style.transform = "";
        const w = el.scrollWidth;
        if (w > availW) {
          el.style.transformOrigin = "center center";
          el.style.transform = "scale(" + (availW / w).toFixed(3) + ")";
        }
      });
    }

    function fadeIn(html){
      stage.classList.remove("show");
      void stage.offsetWidth;
      stage.innerHTML = html;
      // 這裡刻意用 setTimeout 而不是 requestAnimationFrame：視窗被遮蔽或最小化時
      // rAF 會停擺，.show 就永遠加不上去、畫面整片空白，而換頁的計時器還在跑。
      // setTimeout 在背景仍會執行，畫面不會卡在全黑。
      setTimeout(function(){
        fitSlide();
        stage.classList.add("show");
      }, 20);
    }

    window.addEventListener("resize", function(){ fitSlide(); });

    function renderIdleScreen(reason){
      const startT = (SCHEDULE.播放時段 && SCHEDULE.播放時段.開始) || "07:30";
      const endT   = (SCHEDULE.播放時段 && SCHEDULE.播放時段.結束) || "08:30";
      fadeIn('<div class="idle"><div class="idle-time" id="idleClock">--:--</div>'
        + '<div class="idle-msg">成語卡播放時間：每個上課日 '+startT+'–'+endT+'</div>'
        + (reason ? '<div class="idle-reason">今天不播放（'+escapeHtml(reason)+'）</div>' : '')
        + '</div>');
      pbfill.classList.remove("run");
      pbfill.style.transition = "none";
      pbfill.style.width = "0%";
    }

    function updateIdleClock(now){
      const el = document.getElementById("idleClock");
      if (el) el.textContent = hm(now);
    }

    function tick(){
      const now = new Date();
      const school = isSchoolDay(now);
      const playable = DEMO || (school.ok && inPlayWindow(now));

      if (playable){
        if (mode !== "deck"){
          mode = "deck";
          deck = buildDeck();
          idx = 0;
          showSlide();
          ensureWakeLock();
        }
      } else {
        if (mode !== "idle"){
          mode = "idle";
          clearTimeout(timer);
          clearTimeout(pbTimer);
          renderIdleScreen(school.ok ? null : school.reason);
        }
        updateIdleClock(now);
      }
    }

    tick();
    setInterval(tick, 1000);
  })();
  </script>
</body>
</html>
